[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-antivenom"
version = "0.1.0"
description = "Hermes AntiVenom: Epistemic Immune System & Threat Interceptor for AI Agents"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "koutaliman-npc"}
]
keywords = ["ai", "security", "llm", "prompt-injection", "sanitizer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
[project.urls]
Homepage = "https://github.com/koutaliman-npc/hermes-antiven"
